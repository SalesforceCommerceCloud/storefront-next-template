name: Deploy Latest to Test

on:
  push:
    branches: [latest]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  deployments: write

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '10.28.0'

concurrency:
  group: deploy-test
  cancel-in-progress: false

jobs:
  resolve-test-environment:
    name: Resolve Test Environment
    runs-on: ${{ vars.RUNNER_UBUNTU || 'ubuntu-latest' }}
    outputs:
      environment_name: ${{ steps.resolve.outputs.environment_name }}
    steps:
      - name: Require latest branch
        run: |
          if [[ "$GITHUB_REF" != refs/heads/latest ]]; then
            echo "Manual Test deployment must run from the latest branch." >&2
            exit 1
          fi
      - uses: actions/checkout@v6
      - name: Resolve configured Test environment
        id: resolve
        env:
          DEPLOY_ENVIRONMENT_NAMES: ${{ vars.DEPLOY_ENVIRONMENT_NAMES }}
        run: |
          ENVIRONMENT_NAME=$(node scripts/ci/resolve-deployment-environment.mjs test)
          echo "environment_name=$ENVIRONMENT_NAME" >> "$GITHUB_OUTPUT"
      - name: Confirm configured GitHub Environment exists
        env:
          GH_TOKEN: ${{ github.token }}
          ENVIRONMENT_NAME: ${{ steps.resolve.outputs.environment_name }}
        run: |
          ENCODED_ENVIRONMENT_NAME=$(jq -rn --arg value "$ENVIRONMENT_NAME" '$value | @uri')
          gh api "repos/${GITHUB_REPOSITORY}/environments/${ENCODED_ENVIRONMENT_NAME}" >/dev/null

  package-release:
    name: Build and Package Release
    needs: resolve-test-environment
    runs-on: ${{ vars.RUNNER_UBUNTU || 'ubuntu-latest' }}
    timeout-minutes: 30
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
      source_commit: ${{ steps.release.outputs.source_commit }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - run: pnpm cartridge:validate
      - name: Package verified release
        id: release
        run: |
          RELEASE_ID="latest-${GITHUB_SHA}"
          bash scripts/ci/package-release.sh "$RELEASE_ID" "$GITHUB_SHA"
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"
          echo "source_commit=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v6
        with:
          name: release-artifacts-${{ github.run_id }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 14

  deploy-test:
    name: Deploy Verified Release to Test
    needs: [resolve-test-environment, package-release]
    runs-on: ${{ vars.RUNNER_UBUNTU || 'ubuntu-latest' }}
    timeout-minutes: 30
    environment: ${{ needs.resolve-test-environment.outputs.environment_name }}
    env:
      MRT_API_KEY: ${{ secrets.MRT_API_KEY }}
      MRT_PROJECT: ${{ vars.MRT_PROJECT }}
      MRT_ENVIRONMENT: ${{ vars.MRT_ENVIRONMENT || vars.MRT_TARGET }}
      MRT_CLOUD_ORIGIN: ${{ vars.MRT_CLOUD_ORIGIN }}
      MRT_BACKEND: ${{ vars.MRT_BACKEND }}
      SFCC_CLIENT_ID: ${{ vars.SFCC_CLIENT_ID }}
      SFCC_CLIENT_SECRET: ${{ secrets.SFCC_CLIENT_SECRET }}
      SFCC_EXTRA_HEADERS: ${{ secrets.SFCC_EXTRA_HEADERS }}
      SFCC_SERVER: ${{ vars.SFCC_SERVER }}
      SFCC_SHORTCODE: ${{ vars.SFCC_SHORTCODE }}
      SFCC_TENANT_ID: ${{ vars.SFCC_TENANT_ID }}
      SFCC_ACCOUNT_MANAGER_HOST: ${{ vars.SFCC_ACCOUNT_MANAGER_HOST }}
      SFCC_CODE_VERSION: ${{ vars.SFCC_CODE_VERSION }}
      SFCC_LOG_LEVEL: ${{ vars.SFCC_LOG_LEVEL }}
      CI_REF_NAME: latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v7
        with:
          name: release-artifacts-${{ github.run_id }}
          path: release-artifacts
      - name: Verify and deploy release package
        run: >-
          bash scripts/ci/deploy-release.sh test
          "${{ needs.package-release.outputs.release_id }}"
          "${{ needs.package-release.outputs.source_commit }}"
