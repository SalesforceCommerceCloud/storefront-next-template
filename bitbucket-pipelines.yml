# Bitbucket Cloud Free provides 50 build minutes per workspace each month.
# Fork pull requests do not run Pipelines. A same-repository PR also runs the
# source-branch default pipeline, which duplicates minutes on Free. Deployment
# variables are selected only by a step's deployment: binding; arbitrary labels
# and inputs do not scope credentials or grant approval.
image: node:24

definitions:
  caches:
    pnpm: $BITBUCKET_CLONE_DIR/.pnpm-store
  steps:
    - step: &validate-build
        name: Validate build
        caches: [pnpm]
        script:
          - corepack enable
          - corepack prepare pnpm@10.28.0 --activate
          - pnpm config set store-dir "$BITBUCKET_CLONE_DIR/.pnpm-store"
          - |
            if [ -f pnpm-lock.yaml ]; then
              pnpm install --frozen-lockfile
            else
              pnpm install --no-frozen-lockfile
            fi
          - NODE_OPTIONS='--max-old-space-size=4096' pnpm build

    - step: &package-release
        name: Build and package release
        caches: [pnpm]
        script:
          - corepack enable
          - corepack prepare pnpm@10.28.0 --activate
          - pnpm config set store-dir "$BITBUCKET_CLONE_DIR/.pnpm-store"
          - |
            if [ -f pnpm-lock.yaml ]; then
              pnpm install --frozen-lockfile
            else
              pnpm install --no-frozen-lockfile
            fi
          - NODE_OPTIONS='--max-old-space-size=4096' pnpm build
          - pnpm cartridge:validate
          - |
            if [ -n "${BITBUCKET_TAG:-}" ]; then
              RELEASE_ID="$BITBUCKET_TAG"
            else
              RELEASE_ID="latest-$BITBUCKET_COMMIT"
            fi
            bash scripts/ci/package-release.sh "$RELEASE_ID" "$BITBUCKET_COMMIT"
        artifacts:
          - release-artifacts/**

    - step: &deploy-test
        name: Deploy verified release to Test
        deployment: Test
        caches: [pnpm]
        script:
          - corepack enable
          - corepack prepare pnpm@10.28.0 --activate
          - pnpm config set store-dir "$BITBUCKET_CLONE_DIR/.pnpm-store"
          - |
            if [ -f pnpm-lock.yaml ]; then
              pnpm install --frozen-lockfile
            else
              pnpm install --no-frozen-lockfile
            fi
          - bash scripts/ci/deploy-release.sh test "latest-$BITBUCKET_COMMIT" "$BITBUCKET_COMMIT"

    - step: &deploy-staging
        name: Deploy verified release to Staging
        deployment: Staging
        trigger: manual
        max-time: 120
        caches: [pnpm]
        script:
          - corepack enable
          - corepack prepare pnpm@10.28.0 --activate
          - pnpm config set store-dir "$BITBUCKET_CLONE_DIR/.pnpm-store"
          - |
            if [ -f pnpm-lock.yaml ]; then
              pnpm install --frozen-lockfile
            else
              pnpm install --no-frozen-lockfile
            fi
          - bash scripts/ci/deploy-release.sh staging "$BITBUCKET_TAG" "$BITBUCKET_COMMIT"

pipelines:
  default:
    - step: *validate-build

  pull-requests:
    '**':
      - parallel:
          fail-fast: false
          steps:
            - step:
                name: Lint
                caches: [pnpm]
                script:
                  - corepack enable
                  - corepack prepare pnpm@10.28.0 --activate
                  - pnpm config set store-dir "$BITBUCKET_CLONE_DIR/.pnpm-store"
                  - pnpm install --frozen-lockfile
                  - pnpm config:aggregate-extensions && pnpm exec react-router typegen && pnpm lint
            - step:
                name: Typecheck
                caches: [pnpm]
                script:
                  - corepack enable
                  - corepack prepare pnpm@10.28.0 --activate
                  - pnpm config set store-dir "$BITBUCKET_CLONE_DIR/.pnpm-store"
                  - pnpm install --frozen-lockfile
                  - pnpm typecheck
            - step:
                name: Unit tests
                caches: [pnpm]
                max-time: 30
                script:
                  - corepack enable
                  - corepack prepare pnpm@10.28.0 --activate
                  - pnpm config set store-dir "$BITBUCKET_CLONE_DIR/.pnpm-store"
                  - pnpm install --frozen-lockfile
                  - pnpm test
            - step:
                name: Bundle size
                caches: [pnpm]
                script:
                  - corepack enable
                  - corepack prepare pnpm@10.28.0 --activate
                  - pnpm config set store-dir "$BITBUCKET_CLONE_DIR/.pnpm-store"
                  - pnpm install --frozen-lockfile
                  - NODE_OPTIONS='--max-old-space-size=4096' pnpm bundlesize
            - step:
                name: Lighthouse (advisory)
                image: mcr.microsoft.com/playwright:v1.63.0-noble
                caches: [pnpm]
                on-fail:
                  strategy: ignore
                script:
                  # Repository variables provide Fast Setup's public Commerce API
                  # target values and target-valid Lighthouse paths. They do not
                  # select a deployment environment or expose deployment secrets.
                  - export LIGHTHOUSE_BASE_URL="${LIGHTHOUSE_BASE_URL:-http://localhost:3001}"
                  - export LIGHTHOUSE_PATHS="${LIGHTHOUSE_PATHS:-/,/cart}"
                  - corepack enable
                  - corepack prepare pnpm@10.28.0 --activate
                  - pnpm config set store-dir "$BITBUCKET_CLONE_DIR/.pnpm-store"
                  - pnpm install --frozen-lockfile
                  - NODE_OPTIONS='--max-old-space-size=4096' pnpm build
                  - export CHROME_PATH="$(node -e "console.log(require('playwright').chromium.executablePath())")"
                  - pnpm lighthouse:ci

  branches:
    latest:
      - step: *package-release
      - step: *deploy-test

  tags:
    'release-*':
      - step: *package-release
      - step: *deploy-staging

  custom:
    validate:
      - step: *validate-build
    deploy-storefront:
      - step:
          <<: *package-release
          name: Build and package latest release
          script:
            - |
              if [ "${BITBUCKET_BRANCH:-}" != latest ]; then
                echo "Manual Test deployment must run from the latest branch." >&2
                exit 1
              fi
            - corepack enable
            - corepack prepare pnpm@10.28.0 --activate
            - pnpm config set store-dir "$BITBUCKET_CLONE_DIR/.pnpm-store"
            - |
              if [ -f pnpm-lock.yaml ]; then
                pnpm install --frozen-lockfile
              else
                pnpm install --no-frozen-lockfile
              fi
            - NODE_OPTIONS='--max-old-space-size=4096' pnpm build
            - pnpm cartridge:validate
            - bash scripts/ci/package-release.sh "latest-$BITBUCKET_COMMIT" "$BITBUCKET_COMMIT"
      - step: *deploy-test
